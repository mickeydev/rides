server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: user-service-route
          uri: http://user-service:8082
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: ride-service-route
          uri: http://ride-service:8083
          predicates:
            - Path=/api/rides/**
          filters:
            - StripPrefix=1
        - id: payment-service-route
          uri: http://payment-service:8084
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
        - id: rating-service-route
          uri: http://rating-service:8085
          predicates:
            - Path=/api/ratings/**
          filters:
            - StripPrefix=1
