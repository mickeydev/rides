# Server port
server.port=8086

# Application Name
spring.application.name=notification-service

# Datasource Properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/notification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:notificationuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:notificationpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ Properties
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
