# Server port
server.port=8085

# Application Name
spring.application.name=rating-service

# Datasource Properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/rating_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ratinguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ratingpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
