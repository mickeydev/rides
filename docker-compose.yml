# version: '3.8'

services:
  auth-db:
    image: postgres:14-alpine
    container_name: auth-db
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_USER=authuser
      - POSTGRES_PASSWORD=authpassword
      - POSTGRES_DB=auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - community_ride_share_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:14-alpine
    container_name: user-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=useruser
      - POSTGRES_PASSWORD=userpassword
      - POSTGRES_DB=user_db
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - community_ride_share_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useruser -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ride-db:
    image: postgis/postgis:14-3.4
    container_name: ride-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=rideuser
      - POSTGRES_PASSWORD=ridepassword
      - POSTGRES_DB=ride_db
    volumes:
      - ride_db_data:/var/lib/postgresql/data
    networks:
      - community_ride_share_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideuser -d ride_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:14-alpine
    container_name: payment-db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=paymentuser
      - POSTGRES_PASSWORD=paymentpassword
      - POSTGRES_DB=payment_db
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    networks:
      - community_ride_share_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentuser -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rating-db:
    image: postgres:14-alpine
    container_name: rating-db
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=ratinguser
      - POSTGRES_PASSWORD=ratingpassword
      - POSTGRES_DB=rating_db
    volumes:
      - rating_db_data:/var/lib/postgresql/data
    networks:
      - community_ride_share_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratinguser -d rating_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=authuser
      - SPRING_DATASOURCE_PASSWORD=authpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - community_ride_share_network

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "8082:8082"
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-db:5432/user_db
      - SPRING_DATASOURCE_USERNAME=useruser
      - SPRING_DATASOURCE_PASSWORD=userpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - community_ride_share_network

  ride-service:
    build:
      context: ./ride-service
    container_name: ride-service
    ports:
      - "8083:8083"
    depends_on:
      ride-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ride-db:5432/ride_db
      - SPRING_DATASOURCE_USERNAME=rideuser
      - SPRING_DATASOURCE_PASSWORD=ridepassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - community_ride_share_network

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    depends_on:
      payment-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payment-db:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=paymentuser
      - SPRING_DATASOURCE_PASSWORD=paymentpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - community_ride_share_network

  rating-service:
    build:
      context: ./rating-service
    container_name: rating-service
    ports:
      - "8085:8085"
    depends_on:
      rating-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://rating-db:5432/rating_db
      - SPRING_DATASOURCE_USERNAME=ratinguser
      - SPRING_DATASOURCE_PASSWORD=ratingpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - community_ride_share_network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - ride-service
      - payment-service
      - rating-service
    networks:
      - community_ride_share_network

networks:
  community_ride_share_network:
    driver: bridge

volumes:
  auth_db_data:
  user_db_data:
  ride_db_data:
  payment_db_data:
  rating_db_data:
